services:
  postgres:
    image: postgres:17-alpine
    container_name: backend-forge-lab-concurrent-inventory-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: backend_forge_lab
    ports:
      - "55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d backend_forge_lab"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
