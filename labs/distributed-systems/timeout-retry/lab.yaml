name: distributed-systems-timeout-retry
domain: distributed-systems
level: L2
status: active
description: Compare timeout, bounded retry, and exponential backoff behavior when a downstream dependency is slow or temporarily failing.
skills:
  - timeout
  - retry
  - exponential-backoff
  - partial-failure
  - request-amplification
roadmap:
  importance: 5
  targetLevel: L3
runtime:
  type: script
commands:
  prepare: npx tsx experiments/lifecycle.ts prepare
  up: npx tsx experiments/lifecycle.ts up
  observe: npx tsx experiments/observe-state.ts
  status: npx tsx experiments/lifecycle.ts status
  down: npx tsx experiments/lifecycle.ts down
  destroy: npx tsx experiments/lifecycle.ts destroy
experiments:
  timeout:
    command: npx tsx experiments/timeout.ts
    description: Compare short timeout, longer timeout, and fast failure behavior against a simulated downstream call.
  retry:
    command: npx tsx experiments/retry.ts
    description: Compare no retry and bounded retry when the downstream fails once and then recovers.
  exponential-backoff:
    command: npx tsx experiments/exponential-backoff.ts
    description: Compare immediate retry and exponential backoff with jitter under repeated transient failures.
cleanup:
  destructive: false
