name: distributed-systems-idempotency
domain: distributed-systems
level: L2
status: active
description: Reproduce duplicate request behavior and show how an idempotency key prevents repeated business side effects.
skills:
  - idempotency
  - duplicate-request
  - timeout
  - retry
  - side-effect-consistency
roadmap:
  importance: 5
  targetLevel: L3
runtime:
  type: script
commands:
  prepare: npx tsx experiments/lifecycle.ts prepare
  up: npx tsx experiments/lifecycle.ts up
  observe: npx tsx experiments/observe-state.ts
  status: npx tsx experiments/lifecycle.ts status
  down: npx tsx experiments/lifecycle.ts down
  destroy: npx tsx experiments/lifecycle.ts destroy
experiments:
  duplicate-request:
    command: npx tsx experiments/duplicate-request.ts
    description: Show that retrying a timed-out side-effecting request without idempotency can execute the business operation twice.
  idempotency-key:
    command: npx tsx experiments/idempotency-key.ts
    description: Show that the same idempotency key and request fingerprint return a cached result instead of executing again.
  timeout-after-commit:
    command: npx tsx experiments/timeout-after-commit.ts
    description: Show that a retry after caller timeout can safely recover the already-committed result when the key store has the result.
cleanup:
  destructive: false
